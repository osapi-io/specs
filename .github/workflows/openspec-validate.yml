---
name: OpenSpec Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The openspec shim runs under `#!/usr/bin/env node`, so node must be on
      # PATH even though bun installs it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install OpenSpec
        run: |
          bun install -g @fission-ai/openspec@latest
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Validate specs and changes
        run: just validate
