schema: spec-driven

# Shown to AI when creating artifacts. These are constraints on how artifacts
# are written, not content to be copied into them.
context: |
  osapi-io is a multi-repository GitHub organization at
  https://github.com/osapi-io. Repositories are referenced as
  osapi-io/<name>.

  This repository holds the specs; implementation lands in the repository the
  change belongs to (osapi, gohai, nats-client, nats-server, osapi-justfiles,
  osapi-ui, osapi-orchestrator).

  Specs here are normative for those repositories, not only for this one. A
  requirement about repository layout or shared tooling binds every repo the
  proposal names in its Impact section.

  A capability is a subject that changes for one reason. Prefer a flat
  capability layout; do not introduce a domain level until several
  capabilities share it.

  Conventions that apply to every artifact:
  - Markdown is wrapped at 80 columns and formatted with mdformat.
  - Commits follow Conventional Commits with the 50/72 rule.
  - Branches are named type/short-description.
  - Write plainly. State what is true, not what sounds impressive.

# Per-artifact rules.
rules:
  proposal:
    - The Why section states an observed problem — drift, a failure, a
      repeated judgment call — not a preference or a tidiness argument.
    - Impact names every repository affected, so a reader knows the blast
      radius without reading the tasks.
    - Mark breaking changes with BREAKING in What Changes.
  specs:
    - Requirements describe externally observable behavior. If the
      implementation can change without changing the requirement, the
      requirement is at the right level.
    - Do not name files, functions, or libraries in a requirement. Those
      belong in design.md.
    - Every requirement has at least one scenario, and scenarios use concrete
      values rather than "the appropriate response".
    - One behavior per requirement. If it needs "and" to describe itself, it
      is two requirements.
  design:
    - Every decision records at least one alternative considered and why it
      lost. A decision with no alternative is an assertion.
    - Prefer recording the real failure that motivated a decision over an
      abstract argument for it.
    - Risks use the form [Risk] -> Mitigation.
  tasks:
    - Each task is verifiable — state what would prove it done.
    - Order by dependency. A task that breaks consumers is immediately
      followed by the tasks that repair them.
    - Check off work that is already complete rather than restating it as
      pending.

# Advisory guidance for how apply and archive are conducted.
operations:
  apply:
    guidance:
      - Implementation lands in the target repository, not in this one. This
        repository records what was agreed and what is done.
      - Check tasks off as they land, not in a batch at the end.
      - If reality diverges from the spec while implementing, update the
        change rather than quietly building something else.
  archive:
    guidance:
      - Sync specs before archiving so the corpus reflects what was actually
        built, not what was proposed.
      - A change with unfinished tasks is not ready to archive. Either finish
        the tasks or narrow the change.
